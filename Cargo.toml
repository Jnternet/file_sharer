[package]
name = "file_sharer"
version = "0.1.0"
edition = "2024"
authors = ["Jnternet"]
description = "局域网文件记录区：只登记文件位置、点击才传输、服务器只做定向转发（单产物 + 网页 + 断点续传 + SHA-256 校验）"
license = "MIT"
repository = "https://github.com/Jnternet/file_sharer"
homepage = "https://github.com/Jnternet/file_sharer"
readme = "README.md"
keywords = ["lan", "file-transfer", "websocket", "axum", "self-hosted"]
categories = ["web-programming::http-server", "command-line-utilities"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rcgen = "0.13"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
include_dir = "0.7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
