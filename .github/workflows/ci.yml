name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 代码格式检查
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Rust 测试（单元 / 集成 / 架构 / WebSocket 转发）
        run: cargo test

      - name: 前端测试（协议回环 / SHA-256 / 分帧 / ZIP）
        run: node --test tests/js/*.test.js

      - name: 单产物冒烟
        run: bash scripts/smoke.sh
